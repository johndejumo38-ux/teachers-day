<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Teachers' Day 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Envelope -->
        <div class="envelope" id="envelope" onclick="openLetter()">

            <div class="flap"></div>

            <div class="letter">
                <div id="message"></div>
            </div>

            <div class="heart">♥</div>

        </div>

        <p class="instruction" id="instruction">
            Click the letter to open 💌
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
